# Used by the Supabase CLI for local development (`supabase start`) and as a reference for
# the hosted project's Auth settings.
project_id = "linkops"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
# Sign-up is enabled for the /signup page. A self-registered account gets a 'pending' profile
# with no role (trigger public.handle_self_signup) and no data access until a Super Admin
# approves it and enables features. Set enable_signup = false to go back to invitation-only.
enable_signup = true
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your LinkOps account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You're invited to LinkOps"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your LinkOps password"
content_path = "./supabase/templates/recovery.html"

[storage]
file_size_limit = "10MiB"
